<mat-toolbar color="primary" class="main-toolbar">
  <button type="button" aria-label="Toggle sidenav" mat-icon-button (click)="drawer.toggle()">
    <mat-icon aria-label="Side nav toggle icon">menu</mat-icon>
  </button>
  <span>FE_Web</span>
</mat-toolbar>

<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #drawer class="sidenav" fixedInViewport [attr.role]="(isHandset$ | async) ? 'dialog' : 'navigation'"
    [mode]="(isHandset$ | async) ? 'over' : 'side'" [opened]="(isHandset$ | async) === false">
    <mat-toolbar>Menu</mat-toolbar>
    <mat-nav-list>
      <!-- example links, adjust routes/icons as needed -->
      <a mat-list-item routerLink="/dashboard">
        <mat-icon>dashboard</mat-icon>
        <span class="link-text">Dashboard</span>
      </a>
      <a mat-list-item routerLink="/customers">
        <mat-icon>people</mat-icon>
        <span class="link-text">Customers</span>
      </a>

      <mat-list-item class="expandable" (click)="toggleSection('mobile')">
        <mat-icon>phone_iphone</mat-icon>
        <span class="link-text">Item</span>
        <span class="spacer"></span>
        <mat-icon>{{ expanded.mobile ? 'expand_less' : 'expand_more' }}</mat-icon>
      </mat-list-item>
      <mat-nav-list *ngIf="expanded.mobile" class="sub-list">
        <a mat-list-item routerLink="/items">
          <mat-icon>phone_iphone</mat-icon>
          <span class="link-text">iOS</span>
        </a>
        <a mat-list-item routerLink="/mobile/android">
          <mat-icon>android</mat-icon>
          <span class="link-text">Android</span>
        </a>
      </mat-nav-list>

      <mat-list-item class="expandable" (click)="toggleSection('frameworks')">
        <mat-icon>build</mat-icon>
        <span class="link-text">Frameworks</span>
        <span class="spacer"></span>
        <mat-icon>{{ expanded.frameworks ? 'expand_less' : 'expand_more' }}</mat-icon>
      </mat-list-item>
      <mat-nav-list *ngIf="expanded.frameworks" class="sub-list">
        <a mat-list-item routerLink="/frameworks/spring">
          <span class="link-text">Spring</span>
        </a>
        <a mat-list-item routerLink="/frameworks/hibernate">
          <span class="link-text">Hibernate</span>
        </a>
        <a mat-list-item routerLink="/frameworks/struts">
          <span class="link-text">Struts</span>
        </a>
      </mat-nav-list>

      <a mat-list-item routerLink="/orders">
        <mat-icon>person</mat-icon>
        <span class="link-text">Order</span>
      </a>
      <a mat-list-item routerLink="/account">
        <mat-icon>account_circle</mat-icon>
        <span class="link-text">Account</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
